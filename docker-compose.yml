# Dependencias locales de AntFish: MongoDB (replica set rs0, requerido por las
# transacciones ACID del UnitOfWork) y Redis.
#
# Uso:  docker compose up -d mongo redis
# Las credenciales NO viven aquí: se leen de .env (ver .env.example).

services:
  # Genera una sola vez el keyfile de autenticación interna del replica set.
  mongo-keyfile:
    image: alpine:3.20
    restart: "no"
    volumes:
      - mongo_keyfile:/keys
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -s /keys/keyfile ]; then
          head -c 700 /dev/urandom | base64 > /keys/keyfile
        fi
        chown 999:999 /keys/keyfile
        chmod 400 /keys/keyfile

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/keys/keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?defina MONGO_ROOT_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD en .env}
    ports:
      # Solo accesible desde la máquina local.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/keys:ro
      - ./docker/mongo/healthcheck.js:/scripts/healthcheck.js:ro
    healthcheck:
      # Ver docker/mongo/healthcheck.js: inicia el replica set y reporta "healthy" con PRIMARY.
      # Las credenciales no viajan en la línea de comandos.
      test: ["CMD", "mongosh", "--quiet", "--nodb", "--file", "/scripts/healthcheck.js"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Crea/sincroniza los usuarios de mínimo privilegio (idempotente; funciona también
  # sobre un volumen ya inicializado). Se ejecuta tras cada `docker compose up`.
  mongo-users:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DATABASE_NAME: ${DATABASE_NAME:-antfish_db}
      MONGO_APP_USER: ${MONGO_APP_USER:?defina MONGO_APP_USER en .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?defina MONGO_APP_PASSWORD en .env}
      MONGO_MIGRATOR_USER: ${MONGO_MIGRATOR_USER:?defina MONGO_MIGRATOR_USER en .env}
      MONGO_MIGRATOR_PASSWORD: ${MONGO_MIGRATOR_PASSWORD:?defina MONGO_MIGRATOR_PASSWORD en .env}
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - ./docker/mongo/create-users.js:/scripts/create-users.js:ro
    entrypoint:
      - sh
      - -c
      - mongosh --quiet --host mongo --port 27017 -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --file /scripts/create-users.js

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD en .env}
      # redis-cli lo usa para autenticarse en el healthcheck sin pasar la clave por argumentos.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # Con shell para expandir la variable dentro del contenedor (no en el host).
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo_data:
  mongo_keyfile:
