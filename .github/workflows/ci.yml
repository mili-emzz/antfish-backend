name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Mínimo privilegio para el GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (formato)
        run: ruff format --check .

      - name: mypy
        run: mypy app

      - name: import-linter (regla de capas)
        run: lint-imports

      - name: Pruebas unitarias (sin red)
        run: python -m pytest tests/unit -q

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # historial completo: un secreto borrado después sigue en commits previos

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Auditoría de dependencias (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: pip-audit (CVE conocidos en dependencias fijadas)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --no-deps --disable-pip
